name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install stable Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Validate minified Release with an ephemeral non-release key
        shell: bash
        run: |
          set -euo pipefail

          CI_KEYSTORE="$RUNNER_TEMP/mora-ci-validation.jks"
          CI_PASSWORD="$(openssl rand -hex 24)"
          CI_ALIAS="mora-ci-validation"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_MAPPING="app/build/outputs/mapping/release/mapping.prt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          cleanup() {
            rm -f "$CI_KEYSTORE" "$RELEASE_APK"
          }
          trap cleanup EXIT

          keytool -genkeypair \
            -noprompt \
            -keystore "$CI_KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_PASSWORD" \
            -keypass "$CI_PASSWORD" \
            -alias "$CI_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Mora CI Validation"

          export MORA_RELEASE_STORE_FILE="$CI_KEYSTORE"
          export MORA_RELEASE_STORE_PASSWORD="$CI_PASSWORD"
          export MORA_RELEASE_KEY_ALIAS="$CI_ALIAS"
          export MORA_RELEASE_KEY_PASSWORD="$CI_PASSWORD"

          ./gradlew \
            --no-configuration-cache \
            --no-build-cache \
            --no-daemon \
            lintRelease \
            assembleRelease

          [[ -s "$RELEASE_APK" ]] || {
            echo "Minified Release validation APK was not produced." >&2
            exit 1
          }
          [[ -s "$RELEASE_MAPPING" ]] || {
            echo "R8 mapping was not produced." >&2
            exit 1
          }

          "$APKSIGNER" verify --verbose -Werr "$RELEASE_APK"

          VALIDATION_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$RELEASE_APK" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              tr -d '[:space:]:-' |
              tr '[:lower:]' '[:upper:]'
          )"
          REGISTERED_CERT_SHA256="$(
            tr -d '[:space:]:-' < docs/mora-release-certificate.sha256 |
              tr '[:lower:]' '[:upper:]'
          )"

          [[ -n "$VALIDATION_CERT_SHA256" ]]
          [[ -n "$REGISTERED_CERT_SHA256" ]]
          [[ "$VALIDATION_CERT_SHA256" != "$REGISTERED_CERT_SHA256" ]] || {
            echo "CI validation must never use Mora's registered release identity." >&2
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
